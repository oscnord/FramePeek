name: Release Please

# Every push to main opens or refreshes the release PR from the accumulated
# conventional commits. Merging that PR is what ships: the same workflow then
# creates the tag and GitHub release and dispatches the signed build.
# Nothing is released until the release PR is merged.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Two pushes landing together would both force-update the release branch.
# Queue instead of cancelling, so a run is never interrupted mid-update.
concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  # Required by the workflow-dispatch hand-off to release.yml
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Maintain release PR / create release on merged release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tags created with GITHUB_TOKEN do not trigger the tag-push workflow,
      # so dispatch the build explicitly (workflow_dispatch is exempt from
      # the recursive-trigger restriction).
      - name: Trigger signed release build
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            -f tag="${{ steps.release.outputs.tag_name }}"

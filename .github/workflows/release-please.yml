name: Release Please

# Manual-only by design: nothing releases on push or merge to main.
# Run once to open/refresh the release PR from accumulated conventional
# commits; merge that PR when ready; run again to create the tag and
# GitHub release and dispatch the signed build.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  # Required by the workflow-dispatch hand-off to release.yml
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Maintain release PR / create release on merged release PR
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # Tags created with GITHUB_TOKEN do not trigger the tag-push workflow,
      # so dispatch the build explicitly (workflow_dispatch is exempt from
      # the recursive-trigger restriction).
      - name: Trigger signed release build
        if: ${{ steps.release.outputs.release_created }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml \
            --repo "${{ github.repository }}" \
            -f tag="${{ steps.release.outputs.tag_name }}"
